[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-ophys-dff-library"
description = "dF/F estimation for AIND planar optical physiology"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.1.0"

# The library is the single source of dependency truth: the capsule's Code
# Ocean environment installs only this package, pinned to a commit, and pip
# resolves the tree below transitively.
#
# aind-ophys-utils stays at 0.1.0. It supplies both dF/F baselines --
# baseline_fitting.nonlinear_fit (triexp) and dff.dff (percentile) -- so
# bumping it would move the numerical output. Verified that 0.1.0 exposes both
# and that nonlinear_fit's signature is identical in 0.2.0; the sibling
# capsules' >=0.2.0 pin lives in their own images, so there is no conflict.
dependencies = [
    'aind-ophys-utils==0.1.0',
    'joblib==1.5.3',
    # These two move together: aind-data-schema 2.9.0 requires
    # aind-data-schema-models >=6.1.0,<7, so bumping either alone makes the
    # environment unresolvable.
    "aind-data-schema==2.9.0",
    "aind-data-schema-models==6.2.0",
    "aind-pophys-metadata @ git+https://github.com/AllenNeuralDynamics/aind-pophys-metadata.git@b473a1e5288096c48e47d2bf03cb24d48ef46b50",
    "log-schema[cloudwatch] @ git+https://github.com/AllenNeuralDynamics/aind-log-utils.git@f09685e#subdirectory=python",
    "h5py",
    "matplotlib",
    "numpy",
    "scipy",
    "pydantic>=2.7",
    "pydantic-settings>=2.8.1",
]

[dependency-groups]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

# triexp_dff.py and dff_config.py are the dF/F algorithms: exercising them
# needs real extraction output, so they are covered by the Code Ocean data
# run. job.py's stage body is unit-tested, but its Code Ocean entrypoint is
# not, so it stays omitted rather than dragging the gate below 100%.
# settings.py, qc.py and utils/ are held at 100%.
[tool.coverage.run]
omit = [
    "*__init__*",
    "*/triexp_dff.py",
    "*/dff_config.py",
    "*/job.py",
]
source = ["aind_ophys_dff_library", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 79
profile = "black"
skip = [".conda", ".venv"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
