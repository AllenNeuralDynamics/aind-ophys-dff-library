[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aind-ophys-dff-library"
description = "dF/F estimation for AIND planar optical physiology"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Allen Institute for Neural Dynamics"}
]
classifiers = [
    "Programming Language :: Python :: 3"
]
readme = "README.md"
version = "0.1.0"

dependencies = [
    'aind-ophys-utils==0.1.0',
    'joblib==1.5.3',
    'jax==0.6.2',
    "aind-data-schema==2.9.0",
    "aind-data-schema-models==6.3.1",
    "aind-pophys-metadata @ git+https://github.com/AllenNeuralDynamics/aind-pophys-metadata.git@v0.3.1",
    "log-schema[cloudwatch] @ git+https://github.com/AllenNeuralDynamics/aind-log-utils.git@f09685e#subdirectory=python",
    "h5py==3.16.0",
    "matplotlib==3.10.9",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pydantic==2.11.10",
    "pydantic-settings==2.14.2",
]

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/aind-ophys-dff-library"

[dependency-groups]
dev = [
    'black',
    'coverage',
    'flake8',
    'interrogate',
    'isort',
    'Sphinx',
    'furo'
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
target_version = ['py310']
exclude = '''

(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | build
    | dist
    | .conda
  )/
  | .gitignore
)
'''

[tool.coverage.run]
omit = [
    "*__init__*",
    "*/triexp_dff.py",
    "*/dff_config.py",
    "*/job.py",
]
source = ["aind_ophys_dff_library", "tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^from .* import .*",
    "^import .*",
    "pragma: no cover"
]
fail_under = 100

[tool.isort]
line_length = 79
profile = "black"
skip = [".conda", ".venv"]

[tool.interrogate]
exclude = ["setup.py", "docs", "build", ".conda"]
fail-under = 100
